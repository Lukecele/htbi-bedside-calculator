name: Keep HTBI Streamlit App Alive

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC) to prevent Streamlit Community Cloud sleep
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging HTBI Streamlit App to keep it awake..."
          RESPONSE=$(curl -s -c /tmp/cookies.txt -b /tmp/cookies.txt -L --max-redirs 10 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://htbi-bedside-calculator-yu8jwzkifktp2bvvs4ped4.streamlit.app/)
          echo "HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 302 ] || [ "$RESPONSE" -eq 303 ]; then
            echo "Streamlit App is active and responsive (HTTP $RESPONSE)."
          else
            echo "Status $RESPONSE received. Ping signal sent."
          fi
