name: Keep HTBI Streamlit App Alive

on:
  schedule:
    # Runs every 12 hours to keep Streamlit Community Cloud awake and auto-wake if sleeping
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          pip install --quiet playwright
          playwright install chromium

      - name: Visit and wake Streamlit app
        run: |
          python3 - << 'PY'
          import sys
          from playwright.sync_api import sync_playwright

          URL = "https://htbi-bedside-calculator-yu8jwzkifktp2bvvs4ped4.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(5000)

              # If Streamlit Community Cloud put the app to sleep, click the wake button
              wake_btn = page.locator("button:has-text('Yes, get this app back up')")
              if wake_btn.count() > 0:
                  print("App is sleeping — clicking wake button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(30000)

              # Wait for Streamlit app root to render
              try:
                  page.wait_for_selector("[data-testid='stApp'], iframe", timeout=45000)
                  print(f"App active! Title: {page.title()!r} URL: {page.url}")
              except Exception as exc:
                  print(f"App visited ({page.url}), title={page.title()!r}, note={exc}")
              browser.close()
          PY
